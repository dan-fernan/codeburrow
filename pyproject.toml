[project]
name = "codeburrow"
version = "0.1.0"
description = "Hybrid semantic + keyword code search with AST-aware chunking"
requires-python = ">=3.9"
dependencies = [
    "chromadb==1.5.9",
    "ollama==0.6.2",
    "rank-bm25==0.2.2",
    "tree-sitter==0.23.2",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-python==0.23.6",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
codeburrow = "codeburrow:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["codeburrow", "consts", "helper"]
